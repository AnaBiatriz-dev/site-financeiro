<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Financeiro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
    <h1>Financeiro</h1>
    </header>

<main>
    <aside class="sidebar">
    <nav>
        <ul>
            <li><a href="#" class="ativo">Início</a></li>
            <li><a href="#">Gastos</a></li>
            <li><a href="#">Cartões</a></li>
            <li><a href="#">Faturas</a></li>
            <li><a href="#">Configurações</a></li>
        </ul>
    </nav>
</aside>

<section class="dashboard">

    <h2>Visão geral</h2>

    <button class="btn-adicionar">+ Adicionar lançamento</button>

    <div class="formulario-lancamento">

    <h3>Adicionar lançamento</h3>

    <label for="descricao">Descrição</label>
    <input type="text" id="descricao" placeholder="Ex: Mercado">

    <label for="valor">Valor</label>
    <input type="number" id="valor" placeholder="Ex: 150">

    <label for="tipo">Tipo</label>
    <select id="tipo">
        <option value="gasto">Gasto</option>
        <option value="entrada">Entrada</option>
    </select>

    <button class="btn-salvar">Adicionar</button>

</div>

    <div class="cards-resumo">
        

        <div class="card">
            <h3>Entradas</h3>
            <p id="entradas">R$ 0,00</p>
        </div>

        <div class="card">
            <h3>Saldo disponível</h3>
            <p id="saldo">R$ 0,00</p>
        </div>

        <div class="card">
            <h3>Gastos do mês</h3>
            <p id="gastosMes">R$ 0,00</p>
        </div>

        <div class="card">
            <h3>Faturas</h3>
            <p>R$ 0,00</p>
        </div>

    </div>

    <section class="lista-lancamentos">

    <h3>Últimos lançamentos</h3>

    </section>

</section>

</main>

<script src="script.js"></script>

</body>

</html>
